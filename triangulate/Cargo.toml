[package]
name = "triangulate"
version = "0.1.0"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
edition = "2018"

[dependencies]
cdt = { path = "../cdt" }
nurbs = { path = "../nurbs" }
step = { path = "../step" }

log = "0.4.14"
nalgebra-glm = "0.21"
rayon = { version = "1.5", optional = true }
thiserror = "2"

[features]
parallel = ["rayon", "step/parallel"]

[dev-dependencies]
# Self dev-dependency so examples build with `parallel`, matching how the
# regression baseline was recorded (it used to come from gui's feature
# selection). Library consumers are unaffected -- `parallel` is still opt-in.
triangulate = { path = ".", features = ["parallel"] }
clap = "2.33"
glob = "0.3"
env_logger = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libc = "0.2"
