[package]
name = "triangulate"
version = "0.1.0"
authors = ["Matt Keeter <matt.j.keeter@gmail.com>"]
edition = "2018"

[dependencies]
cdt = { path = "../cdt" }
nurbs = { path = "../nurbs" }
step = { path = "../step" }

log = "0.4.14"
nalgebra-glm = "0.21"
rayon = { version = "1.5", optional = true }
robust = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[features]
parallel = ["rayon"]
profiling = []

[dev-dependencies]
serde_json = "1"
# Self dev-dependency so examples build with `parallel`, matching how the
# regression baseline was recorded (it used to come from gui's feature
# selection). Profiling examples also collect phase timings. Both features
# remain opt-in for library consumers.
triangulate = { path = ".", features = ["parallel", "profiling"] }
clap = "2.33"
env_logger = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libc = "0.2"
