name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GUI diagnostic examples use old APIs; test the supported targets.
      - name: Test workspace libraries, binaries, and integration tests
        run: cargo test --workspace --all-features --lib --bins --tests
      - name: Test documentation
        run: cargo test --workspace --all-features --doc
      - name: Test corpus harness
        run: python3 -m unittest discover -s scripts -p 'test_corpus*.py'
      - name: Build corpus worker and exercise checked-in models
        run: |
          cargo build -p triangulate --example corpus_worker
          python3 scripts/corpus.py examples --worker target/debug/examples/corpus_worker --include abstract_pca.step --include cube_hole.step --include cuboid.step --meshes all --output local/corpus-ci
      - name: Upload corpus diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: local/corpus-ci
          if-no-files-found: ignore

  wasm:
    name: WebAssembly check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm -> target
      - name: Check browser library
        run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
